<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitor Information — Adaptive Explorer Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241F1C;
    --paper:#EFE7D8;
    --surface:#FBF8F1;
    --indigo:#223A5E;
    --indigo-soft:#D8E0E9;
    --clay:#B5502F;
    --brass:#B8863B;
    --jade:#4C7A5E;
    --line:#D9CFBB;
    --font-display:'Fraunces', serif;
    --font-body:'Plus Jakarta Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- prototype note strip ---------- */
  .proto-strip{
    background:var(--ink); color:var(--paper);
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.02em;
    padding:6px 16px; text-align:center;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:32px;height:32px;border-radius:50%;
    background:var(--indigo); color:var(--paper);
    display:flex;align-items:center;justify-content:center;
  }
  .brand .name{font-family:var(--font-display); font-weight:600; font-size:17px;}
  .brand .section-label{font-family:var(--font-mono); font-size:11px; color:#6b6459; text-transform:uppercase; letter-spacing:.06em;}
  .lang-toggle{
    display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden;
    font-family:var(--font-mono); font-size:12px;
  }
  .lang-toggle button{
    background:none; border:none; padding:6px 14px; color:var(--ink); opacity:.55;
  }
  .lang-toggle button.active{background:var(--indigo); color:var(--paper); opacity:1;}

  /* ---------- breadcrumb trail ---------- */
  .crumbtrail{
    position:sticky; top:0; z-index:20;
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:0 20px; display:flex; align-items:center; gap:10px;
    height:48px; overflow-x:auto; white-space:nowrap;
  }
  .crumb{display:flex; align-items:center; gap:10px;}
  .crumb-dot{
    width:8px; height:8px; border-radius:50%; background:var(--line); flex-shrink:0;
  }
  .crumb-link{
    display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink); opacity:.6;
    background:none; border:none; padding:4px 2px;
  }
  .crumb-link:hover{opacity:1; color:var(--indigo);}
  .crumb-link.current{opacity:1; font-weight:600;}
  .crumb-link.current .crumb-dot{
    background:var(--indigo); width:10px; height:10px;
    box-shadow:0 0 0 3px var(--indigo-soft);
  }
  .crumb-sep{width:16px; height:1px; background:var(--line); flex-shrink:0;}
  .crumb-more{
    font-family:var(--font-mono); font-size:12px; color:var(--ink); opacity:.6;
    background:var(--paper); border:1px solid var(--line); border-radius:999px;
    padding:2px 8px; position:relative;
  }
  .crumb-popover{
    display:none; position:absolute; top:28px; left:0; background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:8px; min-width:180px;
    box-shadow:0 8px 24px rgba(36,31,28,.12); z-index:30;
  }
  .crumb-popover.open{display:block;}
  .crumb-popover a{display:block; padding:6px 8px; font-size:13px; border-radius:6px;}
  .crumb-popover a:hover{background:var(--indigo-soft);}

  /* ---------- layout ---------- */
  .body-layout{display:flex; align-items:flex-start;}
  .rail{
    display:none; flex-direction:column; gap:2px; flex-shrink:0;
    width:260px; padding:18px 10px; position:sticky; top:48px;
    height:calc(100vh - 48px); overflow-y:auto;
    background:repeating-linear-gradient(45deg, rgba(34,58,94,.035) 0 2px, transparent 2px 10px);
    border-right:1px solid var(--line);
  }
  .rail.collapsed{width:64px;}
  .rail-toggle{
    align-self:flex-end; background:none; border:1px solid var(--line); border-radius:8px;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    margin-bottom:8px; color:var(--ink); opacity:.6;
  }
  .rail-root{
    display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:8px;
    font-size:13.5px; font-weight:600; margin-bottom:6px;
  }
  .rail-root .rail-icon{color:var(--indigo);}
  .rail-group{position:relative; padding-left:14px; margin-bottom:2px;}
  .rail-group::before{
    content:""; position:absolute; left:5px; top:0; bottom:0; width:1px; background:var(--line);
  }
  .rail-row{
    display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:8px;
    font-size:13.5px; width:100%; text-align:left; background:none; border:none; color:var(--ink);
  }
  .rail-row:hover{background:var(--indigo-soft);}
  .rail-row.active{background:var(--indigo-soft); border-left:3px solid var(--indigo); padding-left:5px; font-weight:600;}
  .rail-row .rail-icon{flex-shrink:0; width:18px; height:18px; color:var(--brass);}
  .rail-row.active .rail-icon{color:var(--indigo);}
  .rail-label{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rail.collapsed .rail-label,
  .rail.collapsed .rail-root .rail-label{display:none;}
  .rail-dot{
    width:26px; height:26px; border-radius:50%; background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; margin:3px 0 3px 8px; color:var(--ink); opacity:.65;
  }
  .rail-dot:hover{opacity:1; border-color:var(--indigo);}
  .rail-dot svg{width:13px;height:13px;}

  .content{flex:1; min-width:0; padding:26px 24px 60px; max-width:960px; margin:0 auto; width:100%;}

  /* ---------- chip scroller ---------- */
  .chip-scroller{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:18px;
    -webkit-overflow-scrolling:touch;
  }
  .chip{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); font-size:13px; white-space:nowrap;
  }
  .chip.active{background:var(--indigo); color:var(--paper); border-color:var(--indigo);}
  .chip svg{width:14px;height:14px;}

  /* ---------- hero / hub ---------- */
  .hub-hero{padding:6px 0 28px;}
  .hub-hero h1{font-family:var(--font-display); font-size:38px; margin:0 0 10px; font-weight:600;}
  .hub-hero p{max-width:560px; color:#4b453d; font-size:15.5px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:16px;}

  .card-section{
    position:relative; border-radius:14px; overflow:hidden; aspect-ratio:4/3;
    display:flex; flex-direction:column; justify-content:flex-end; padding:16px;
    color:var(--paper); border:1px solid var(--line);
    transition:transform .2s ease-out;
  }
  .card-section:hover{transform:translateY(-3px);}
  .card-section .badge-count{
    position:absolute; bottom:14px; right:14px; font-family:var(--font-mono); font-size:11px;
    background:rgba(239,231,216,.18); border:1px solid rgba(239,231,216,.4); padding:2px 8px; border-radius:999px;
  }
  .card-section .cs-icon{
    position:absolute; top:14px; left:14px; width:34px; height:34px; border-radius:9px;
    background:rgba(239,231,216,.9); color:var(--indigo); display:flex; align-items:center; justify-content:center;
  }
  .card-section .cs-scrim{position:absolute; inset:0; z-index:0;}
  .card-section h3, .card-section p{position:relative; z-index:1; margin:0;}
  .card-section h3{font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:4px;}
  .card-section p{font-size:12.5px; opacity:.9;}

  .card-page{
    border:1px solid var(--line); background:var(--surface); border-radius:12px;
    padding:16px; display:flex; flex-direction:column; gap:8px; transition:border-color .15s;
  }
  .card-page:hover{border-color:var(--indigo-soft); }
  .card-page .cp-icon{color:var(--brass); width:26px; height:26px;}
  .card-page h3{font-family:var(--font-display); font-size:16.5px; margin:2px 0 0; font-weight:600;}
  .card-page p{font-size:13px; color:#4b453d; margin:0;}
  .card-page .cp-meta{font-family:var(--font-mono); font-size:11px; color:#8a8172; margin-top:auto;}

  .section-header{margin-bottom:18px;}
  .section-header h1{font-family:var(--font-display); font-size:28px; margin:0 0 6px; font-weight:600;}
  .section-header p{color:#4b453d; font-size:14.5px; max-width:600px;}

  /* ---------- page (detail) ---------- */
  .page-header h1{font-family:var(--font-display); font-size:30px; margin:0 0 8px; font-weight:600;}
  .meta-strip{font-family:var(--font-mono); font-size:11.5px; color:#8a8172; margin-bottom:20px; display:flex; gap:14px;}
  .page-body h2{font-family:var(--font-display); font-size:19px; margin:22px 0 8px; font-weight:600;}
  .page-body p{font-size:15px; color:#3a352f; margin:0 0 10px;}
  .page-body ul{margin:0 0 10px; padding-left:20px;}
  .page-body li{font-size:15px; margin-bottom:4px; color:#3a352f;}

  .prevnext{display:flex; justify-content:space-between; gap:12px; margin-top:32px; padding-top:16px; border-top:1px solid var(--line);}
  .prevnext a{font-size:13px; border:1px solid var(--line); border-radius:10px; padding:10px 14px; flex:1; background:var(--surface);}
  .prevnext .lbl{display:block; font-family:var(--font-mono); font-size:10.5px; opacity:.6; margin-bottom:3px; text-transform:uppercase;}

  .related{margin-top:30px;}
  .related h4{font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.06em; font-size:11.5px; color:#8a8172; margin:0 0 10px;}
  .related-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:12px;}

  /* ---------- mobile drawer ---------- */
  .drawer-trigger{
    display:none; position:fixed; right:18px; bottom:18px; z-index:40;
    background:var(--indigo); color:var(--paper); border:none; border-radius:999px;
    padding:12px 18px; align-items:center; gap:8px; font-size:13.5px; font-weight:600;
    box-shadow:0 8px 20px rgba(36,31,28,.25);
  }
  .drawer-trigger svg{width:16px;height:16px;}
  .scrim{
    display:none; position:fixed; inset:0; background:rgba(36,31,28,.35); z-index:45;
  }
  .scrim.open{display:block;}
  .drawer{
    position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--surface);
    border-radius:18px 18px 0 0; max-height:74vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .25s ease-out;
    padding:14px 16px 24px;
  }
  .drawer.open{transform:translateY(0);}
  .drawer-handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 14px;}
  .drawer-level{margin-bottom:16px;}
  .drawer-level .dl-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:#8a8172; margin-bottom:6px;}
  .drawer-row{
    display:flex; align-items:center; gap:10px; padding:11px 10px; border-radius:10px; width:100%;
    background:none; border:none; font-size:14.5px; text-align:left; color:var(--ink);
  }
  .drawer-row.active{background:var(--indigo-soft); font-weight:600;}
  .drawer-row .di{width:18px;height:18px; color:var(--brass); flex-shrink:0;}
  .drawer-row.active .di{color:var(--indigo);}

  /* ---------- responsive ---------- */
  @media (min-width:768px){
    .rail{display:flex;}
    .drawer-trigger{display:none !important;}
  }
  @media (max-width:1023px){
    .rail{width:64px !important;}
    .rail .rail-label{display:none;}
    .rail-toggle{display:none;}
    .rail-root{justify-content:center;}
  }
  @media (min-width:1024px){
    .chip-scroller.desktop-hide{display:none;}
  }
  @media (max-width:767px){
    .drawer-trigger{display:flex;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="proto-strip">VISITOR INFORMATION — ADAPTIVE EXPLORER PROTOTYPE · demo data from content-tree.json · click around, resize the window to see mobile/tablet behaviour</div>

<div class="topbar">
  <div class="brand">
    <div class="mark" id="brandIcon"></div>
    <div>
      <div class="name">Experience Jogja</div>
      <div class="section-label">Visitor Information</div>
    </div>
  </div>
  <div class="lang-toggle">
    <button data-lang="en" class="active">EN</button>
    <button data-lang="id">ID</button>
  </div>
</div>

<div id="crumbtrailWrap"></div>

<div class="body-layout">
  <nav class="rail" id="rail"></nav>
  <main class="content" id="content"></main>
</div>

<button class="drawer-trigger" id="drawerTrigger"></button>
<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer"><div class="drawer-handle"></div><div id="drawerContent"></div></div>

<script>
/* ============================================================

const ICONS = {

  landmark: '<line x1="3" y1="21" x2="21" y2="21"/><line x1="5" y1="21" x2="5" y2="10"/><line x1="19" y1="21" x2="19" y2="10"/><polygon points="12,3 21,9 3,9"/><line x1="9" y1="21" x2="9" y2="10"/><line x1="15" y1="21" x2="15" y2="10"/>',
  shirt: '<path d="M8 4 L12 6 L16 4 L21 8 L18 11 L16 9.5 V20 H8 V9.5 L6 11 L3 8 Z"/>',
  chat: '<path d="M4 5 H20 V15 H9 L5 19 V15 H4 Z"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="12" x2="13" y2="12"/>',
  map: '<path d="M9 4 L3 6 V20 L9 18 L15 20 L21 18 V4 L15 6 L9 4 Z"/><line x1="9" y1="4" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="20"/>'
};
const ICONMAP = {
  compass:'compass', plane:'plane', 'plane-landing':'plane', 'train-front':'train',
  'bus-front':'bus', bus:'bus', 'car-taxi-front':'car', 'bed-double':'bed',
  'map-pinned':'pin', mountain:'mountain', wallet:'wallet', banknote:'banknote',
  coins:'coins', 'credit-card':'card', receipt:'receipt', 'shield-plus':'shield',
  'shield-check':'shield', 'phone-call':'phone', cross:'cross', landmark:'landmark',
  shirt:'shirt', languages:'chat', map:'map'
};
function icon(key, size){
  size = size || 18;
  const k = ICONMAP[key] || 'pin';
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
}
document.getElementById('brandIcon').innerHTML = icon('compass', 18);

   DATA — identical to content-tree.json (the PRD's source of truth)

              "body": {
                "en": "## Overview\nYIA (airport code: YIA) opened in 2019 and now handles almost all commercial flights to Yogyakarta, domestic and international.\n\n## Getting into the city\n- **Airport Rail**: direct service to Tugu Station, ~40 minutes.\n- **DAMRI shuttle bus**: connects to Malioboro and Prambanan.\n- **Ride-hailing**: pickup available from the designated zone on the ground floor.\n\n## Facilities\nPrayer rooms, nursing rooms, lounges, and a batik-themed retail corridor referencing local craft.",

            {

/* ============================================================
   INDEX + helpers
   ============================================================ */
let INDEX = {}; // id -> { node, path: [ids without hub], parentPath: [ids] }
(function buildIndex(node, path){
  INDEX[node.id] = { node, path };
  (node.children || []).forEach(child => buildIndex(child, path.concat(child.id)));
})(TREE, []);

function getNodeAtPath(pathArr){
  let node = TREE;
  for (const id of pathArr){
    node = (node.children || []).find(c => c.id === id);
    if (!node) return null;
  }
  return node;
}
function title(node){ return node.title[state.lang]; }
function summary(node){ return node.summary[state.lang]; }

/* ============================================================
   STATE
   ============================================================ */
const state = { path: [], lang: 'en', railCollapsed: false, drawerOpen: false };

function parseHash(){
  const raw = location.hash.replace('#','');
  if (!raw) { state.path = []; return; }
  const ids = raw.split('/').filter(Boolean);
  // validate the path actually resolves; fall back to hub if not
  state.path = getNodeAtPath(ids) ? ids : [];
}
function navigate(pathArr){
  state.path = pathArr;
  location.hash = pathArr.join('/');
  state.drawerOpen = false;
  render();
  window.scrollTo({top:0, behavior:'instant'});
}
window.addEventListener('hashchange', () => { parseHash(); render(); });

/* ============================================================
   BREADCRUMB TRAIL
   ============================================================ */
function renderCrumb(){
  const ancestors = [{node:TREE, path:[]}];
  let acc = [];
  for (const id of state.path){
    acc = acc.concat(id);
    ancestors.push({ node: getNodeAtPath(acc), path: acc.slice() });
  }
  let html = '<div class="crumbtrail">';
  const collapse = ancestors.length > 4;
  const visible = collapse ? [ancestors[0], {more:true, items: ancestors.slice(1, ancestors.length-2)}, ancestors[ancestors.length-2], ancestors[ancestors.length-1]] : ancestors;

  visible.forEach((item, i) => {
    if (i > 0) html += '<div class="crumb-sep"></div>';
    if (item.more){
      html += `<div class="crumb-more" onclick="togglePopover(event)">…
        <div class="crumb-popover" id="crumbPop">${item.items.map(a =>
          `<a href="#" onclick="event.preventDefault(); navigate(${JSON.stringify(a.path)})">${title(a.node)}</a>`).join('')}</div>
      </div>`;
    } else {
      const isCurrent = item.path.length === state.path.length;
      html += `<button class="crumb-link ${isCurrent ? 'current' : ''}" onclick="navigate(${JSON.stringify(item.path)})">
        <span class="crumb-dot"></span>${title(item.node)}
      </button>`;
    }
  });
  html += '</div>';
  document.getElementById('crumbtrailWrap').innerHTML = html;
}
function togglePopover(e){
  e.stopPropagation();
  document.getElementById('crumbPop').classList.toggle('open');
}
document.addEventListener('click', () => {
  const pop = document.getElementById('crumbPop');
  if (pop) pop.classList.remove('open');
});

/* ============================================================
   TRAIL RAIL (desktop/tablet)
   ============================================================ */
function renderRail(){
  const rail = document.getElementById('rail');
  if (state.path.length === 0){ rail.innerHTML=''; return; } // no rail on hub page

  let html = `<button class="rail-toggle" onclick="toggleRail()">${state.railCollapsed ? '»' : '«'}</button>`;
  html += `<a class="rail-root" href="#" onclick="event.preventDefault(); navigate([])">
    <span class="rail-icon">${icon('compass',18)}</span><span class="rail-label">Visitor Information</span>
  </a>`;

  function renderLevel(nodes, activeId, ancestorPath, depth){
    let out = `<div class="rail-group">`;
    nodes.forEach(n => {
      const isActive = n.id === activeId;
      const nodePath = ancestorPath.concat(n.id);
      if (isActive){
        out += `<button class="rail-row active" onclick="navigate(${JSON.stringify(nodePath)})">
          <span class="rail-icon">${icon(n.icon,17)}</span><span class="rail-label">${title(n)}</span>
        </button>`;
        if (n.children && n.children.length){
          const nextActiveId = state.path[depth+1] || null;
          out += renderLevel(n.children, nextActiveId, nodePath, depth+1);
        }
      } else {
        out += `<button class="rail-dot" title="${title(n)}" onclick="navigate(${JSON.stringify(nodePath)})">
          ${icon(n.icon,13)}
        </button>`;
      }
    });
    out += `</div>`;
    return out;
  }
  html += renderLevel(TREE.children, state.path[0], [], 0);
  rail.className = 'rail' + (state.railCollapsed ? ' collapsed' : '');
  rail.innerHTML = html;
}
function toggleRail(){ state.railCollapsed = !state.railCollapsed; renderRail(); }

/* ============================================================
   CHIP SCROLLER (siblings at current level)
   ============================================================ */
function renderChips(){
  if (state.path.length === 0) return '';
  const parentPath = state.path.slice(0, -1);
  const parent = getNodeAtPath(parentPath);
  const siblings = parent.children;
  const currentId = state.path[state.path.length-1];
  let html = '<div class="chip-scroller desktop-hide">';
  siblings.forEach(s => {
    const isActive = s.id === currentId;
    const p = parentPath.concat(s.id);
    html += `<button class="chip ${isActive?'active':''}" onclick="navigate(${JSON.stringify(p)})">
      ${icon(s.icon,14)}${title(s)}
    </button>`;
  });
  html += '</div>';
  return html;
}

/* ============================================================
   MOBILE DRAWER
   ============================================================ */
function renderDrawer(){
  let html = '';
  let levelNodes = TREE.children;
  let ancestorPath = [];
  for (let depth = 0; depth <= state.path.length; depth++){
    const activeId = state.path[depth];
    const levelLabel = depth === 0 ? 'Category' : (depth === 1 ? 'Subcategory' : 'Page');
    html += `<div class="drawer-level"><div class="dl-label">${levelLabel}</div>`;
    levelNodes.forEach(n => {
      const isActive = n.id === activeId;
      const nodePath = ancestorPath.concat(n.id);
      html += `<button class="drawer-row ${isActive?'active':''}" onclick="navigate(${JSON.stringify(nodePath)})">
        <span class="di">${icon(n.icon,17)}</span>${title(n)}
      </button>`;
    });
    html += '</div>';
    if (!activeId) break;
    const activeNode = levelNodes.find(n => n.id === activeId);
    ancestorPath = ancestorPath.concat(activeId);
    if (!activeNode.children) break;
    levelNodes = activeNode.children;
  }
  document.getElementById('drawerContent').innerHTML = html;
}
document.getElementById('drawerTrigger').addEventListener('click', () => {
  state.drawerOpen = true; syncDrawer();
});
document.getElementById('scrim').addEventListener('click', () => {
  state.drawerOpen = false; syncDrawer();
});
function syncDrawer(){
  document.getElementById('drawer').classList.toggle('open', state.drawerOpen);
  document.getElementById('scrim').classList.toggle('open', state.drawerOpen);
}

/* ============================================================
   CARDS
   ============================================================ */
const SCRIM_COLORS = ['#223A5E','#4C7A5E','#B5502F','#8a6b3a','#5c4a63','#2f5c66'];
function sectionCard(node, path, colorSeed){
  const bg = SCRIM_COLORS[colorSeed % SCRIM_COLORS.length];
  const count = node.children ? node.children.length : 0;
  return `<a class="card-section" style="background:linear-gradient(160deg, ${bg} 0%, ${bg}cc 55%, ${bg}55 100%)" href="#" onclick="event.preventDefault(); navigate(${JSON.stringify(path)})">
    <div class="cs-icon">${icon(node.icon,18)}</div>
    <h3>${title(node)}</h3>
    <p>${summary(node)}</p>
    ${count ? `<div class="badge-count">${count} inside</div>` : ''}
  </a>`;
}
function pageCard(node, path){
  return `<a class="card-page" href="#" onclick="event.preventDefault(); navigate(${JSON.stringify(path)})">
    <div class="cp-icon">${icon(node.icon,24)}</div>
    <h3>${title(node)}</h3>
    <p>${summary(node)}</p>
    ${node.meta ? `<div class="cp-meta">${node.meta.estReadMins} min read · ${node.meta.lastUpdated}</div>` : ''}
  </a>`;
}
function childCard(node, path, i){
  return node.kind === 'page' ? pageCard(node, path) : sectionCard(node, path, i);
}

/* ============================================================
   TINY MARKDOWN RENDERER (## headings, - lists, **bold**, paragraphs)
   ============================================================ */
function mdToHtml(md){
  const lines = md.split('\n');
  let html = ''; let inList = false;
  lines.forEach(line => {
    line = line.trim();
    if (line.startsWith('## ')){
      if (inList){ html += '</ul>'; inList=false; }
      html += `<h2>${line.slice(3)}</h2>`;
    } else if (line.startsWith('- ')){
      if (!inList){ html += '<ul>'; inList = true; }
      html += `<li>${inlineMd(line.slice(2))}</li>`;
    } else if (line === ''){
      if (inList){ html += '</ul>'; inList = false; }
    } else {
      if (inList){ html += '</ul>'; inList = false; }
      html += `<p>${inlineMd(line)}</p>`;
    }
  });
  if (inList) html += '</ul>';
  return html;
}
function inlineMd(s){ return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }

/* ============================================================
   PAGE TEMPLATES
   ============================================================ */
function renderHub(){
  let html = `<div class="hub-hero">
    <h1>${title(TREE)}</h1>
    <p>${summary(TREE)}</p>
  </div>
  <div class="grid">`;
  TREE.children.forEach((n,i) => { html += sectionCard(n, [n.id], i); });
  html += '</div>';
  return html;
}
function renderSection(node, path){
  let html = `<div class="section-header"><h1>${title(node)}</h1><p>${summary(node)}</p></div>`;
  html += renderChips();
  html += '<div class="grid">';
  node.children.forEach((n,i) => { html += childCard(n, path.concat(n.id), i); });
  html += '</div>';
  return html;
}
function renderPage(node, path){
  const parentPath = path.slice(0,-1);
  const siblings = getNodeAtPath(parentPath).children;
  const idx = siblings.findIndex(s => s.id === node.id);
  const prev = siblings[idx-1], next = siblings[idx+1];

  let html = renderChips();
  html += `<div class="page-header"><h1>${title(node)}</h1></div>`;
  if (node.meta){
    html += `<div class="meta-strip"><span>${node.meta.estReadMins} min read</span><span>Updated ${node.meta.lastUpdated}</span></div>`;
  }
  html += `<div class="page-body">${mdToHtml(node.body ? node.body[state.lang] : '')}</div>`;

  html += `<div class="prevnext">
    ${prev ? `<a href="#" onclick="event.preventDefault(); navigate(${JSON.stringify(parentPath.concat(prev.id))})"><span class="lbl">← Previous</span>${title(prev)}</a>` : '<div></div>'}
    ${next ? `<a href="#" onclick="event.preventDefault(); navigate(${JSON.stringify(parentPath.concat(next.id))})" style="text-align:right"><span class="lbl">Next →</span>${title(next)}</a>` : '<div></div>'}
  </div>`;

  const relatedIds = (node.meta && node.meta.relatedPageIds) || [];
  const related = relatedIds.map(id => INDEX[id]).filter(Boolean);
  if (related.length){
    html += `<div class="related"><h4>Related</h4><div class="related-grid">`;
    related.forEach(r => { html += pageCard(r.node, r.path); });
    html += `</div></div>`;
  }
  return html;
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  const node = getNodeAtPath(state.path);
  document.getElementById('content').innerHTML =
    state.path.length === 0 ? renderHub() :
    node.kind === 'section' ? renderSection(node, state.path) :
    renderPage(node, state.path);

  renderCrumb();
  renderRail();
  renderDrawer();
  syncDrawer();

  document.getElementById('drawerTrigger').innerHTML =
    icon('compass',16) + 'Browse';
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === state.lang);
  });
}
document.querySelectorAll('.lang-toggle button').forEach(b => {
  b.addEventListener('click', () => { state.lang = b.dataset.lang; render(); });
});

parseHash();
render();
</script>
</body>
</html>
